<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <style>
    :root { --bg: #0f1115; --fg: #e8e8ea; --muted: #8b8d94; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; padding: 16px; text-align: center; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -0.02em; }
    p { color: var(--muted); margin-top: .75rem; }
  </style>
</head>
<body>
  <main>
    <h1>Portfolio</h1>
    <p>Segera hadir.</p>
  </main>
</body>
</html>
